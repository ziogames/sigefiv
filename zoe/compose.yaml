services:
  zoe-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zoe-gateway
    restart: unless-stopped
    mem_limit: 1.5g
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      WHISPER_MODEL: "base"
      WHISPER_DEVICE: "cpu"
      WHISPER_COMPUTE: "int8"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HOME: "/root/.cache/huggingface"
    volumes:
      - zoe-model-cache:/root/.cache

volumes:
  zoe-model-cache:
